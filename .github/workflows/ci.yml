# SelfTUI CI — runs on every pull request and every push to main.
#
# Mirrors the local release gate (scripts/release-check.sh) minus the
# release-only steps: go mod verify, gofmt check, go vet, uncached tests,
# race tests on Linux, govulncheck, and CGO-disabled Linux builds — all on
# the pinned Go toolchain below (go.mod's `go` directive is the floor, not
# the CI version).
#
# Least privilege: contents are read-only; no secrets are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Current official stable Go release at phase-8 time (2026-09-04). The
  # local release gate is run with the same toolchain so local == CI.
  GO_VERSION: "1.27.1"
  # golang.org/x/vuln release pinned for reproducibility.
  GOVULNCHECK_VERSION: "v1.7.0"

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Go ${{ env.GO_VERSION }} · fmt · vet · test · race · vuln · cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: Format check (make fmt)
        run: make fmt

      - name: go vet (make vet)
        run: make vet

      - name: Uncached unit/golden tests (make test)
        run: make test

      - name: Race tests on Linux (make race)
        run: make race

      - name: Install govulncheck ${{ env.GOVULNCHECK_VERSION }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck (make vuln)
        run: make vuln

      - name: CGO-disabled Linux builds (make build-linux-amd64 build-linux-arm64)
        run: make build-linux-amd64 build-linux-arm64
