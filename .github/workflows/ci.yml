# SelfTUI CI — runs on every pull request and every push to main.
#
# Mirrors the local release gate (scripts/release-check.sh) minus the
# release-only steps: go mod verify, gofmt check, go vet, uncached tests,
# race tests on Linux, govulncheck, and CGO-disabled Linux builds — all on
# the pinned Go toolchain below (go.mod's `go` directive is the floor, not
# the CI version).
#
# Least privilege: contents are read-only; no secrets are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Current official stable Go release at phase-8 time (2026-09-04).
  # The local release gate is run with the same toolchain so local == CI.
  GO_VERSION: "1.27.1"
  # golang.org/x/vuln release pinned for reproducibility.
  GOVULNCHECK_VERSION: "v1.7.0"

defaults:
  run:
    shell: bash

jobs:
  gate:
    # Static job name (no env context): GitHub does not allow the `env`
    # context in job names, and the name doubles as the required-status-
    # check context for branch protection, so it must not drift with the
    # pinned Go version above.
    name: Go fmt · vet · test · race · vuln · cross-build
    # Stuck runs are auto-cancelled.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Pinned SHA (not mutable @v ref) — supply-chain audit item.
      # actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go ${{ env.GO_VERSION }}
        # actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: Format check (make fmt)
        run: make fmt

      - name: go vet (make vet)
        run: make vet

      - name: Uncached unit/golden tests (make test)
        run: make test

      - name: Race tests on Linux (make race)
        run: make race

      - name: Install govulncheck ${{ env.GOVULNCHECK_VERSION }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck (make vuln)
        run: make vuln

      - name: CGO-disabled Linux builds (make build-linux-amd64 build-linux-arm64)
        run: make build-linux-amd64 build-linux-arm64

      # --- supply-chain secret scanning (P0) ---
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gitleaks secret scan (make secret-scan)
        run: make secret-scan

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint (make actionlint)
        run: make actionlint
